name: NFTScan sandbox build
on:
  push:
    branches: [sandbox/full-upgrade-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run check
      - run: npm run selftest
      - run: node test/full-upgrade.js
      - run: npm run dry
        env:
          DRY_RUN: '1'
      - name: Package clean sandbox
        run: |
          rm -rf .git .github/workflows/sandbox-build.yml dist state.json .env
          mkdir dist
          zip -r dist/NFTScan-full-upgrade-v1.zip . -x 'dist/*' '*.log' '.DS_Store'
          sha256sum dist/NFTScan-full-upgrade-v1.zip > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NFTScan-full-upgrade-v1
          path: dist/
          if-no-files-found: error
